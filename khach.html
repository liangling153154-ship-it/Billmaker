<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sen's Khách hàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&display=swap">
<script src="sb.js"></script>
<script src="animals.js"></script>
<script src="shell.js" defer></script>
<style>
/* Hồ sơ khách: mỗi khách một mã KH, các hóa đơn (phòng/xe + combo) và từng lần thu tiền.
   Cùng bảng màu với combo.html. */
:root{
  --bg:#f6efe8; --paper:#fffdfa; --ink:#2b1d14; --muted:#7a6656; --line:#e6d6c6;
  --accent:#b8612a; --accent-ink:#fff; --soft:#f3e2d3; --field:#fff; --bad:#b3261e; --good:#2e7d32;
  --display:"Lora",Georgia,serif; --body:"Be Vietnam Pro",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1511; --paper:#271d17; --ink:#f2e6db; --muted:#b39c89; --line:#3e3027;
  --accent:#e08a4f; --accent-ink:#1c1511; --soft:#3a2a20; --field:#211913; --bad:#ff8a80; --good:#81c784; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  padding-top:max(10px,env(safe-area-inset-top));background:var(--accent);color:var(--accent-ink)}
.top h1{flex:1;margin:0;font-family:var(--display);font-size:1.15rem;line-height:1.2;min-width:120px}
.top a{color:inherit;text-decoration:none;font:600 13px var(--body);border:1px solid currentColor;border-radius:8px;padding:6px 10px;white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;font:600 14px var(--body);padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--soft);border-color:var(--accent)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);
  border-radius:7px;padding:9px 10px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:600 14px var(--body);border-radius:9px;padding:9px 12px;cursor:pointer;border:1px solid var(--accent);white-space:nowrap;text-decoration:none;display:inline-block}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:var(--paper);color:var(--accent)}
.small{font-size:12.5px;padding:6px 10px}
.danger{color:var(--bad);border-color:var(--bad);background:var(--paper)}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hint{font-size:.8rem;color:var(--muted);margin:4px 0 0}
.err{color:var(--bad)}
h2{font-family:var(--display);font-size:1.1rem;margin:16px 0 8px}
.cust{display:grid;grid-template-columns:1fr auto;gap:0 10px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.cust b{font-weight:600} .cust .m{font-size:.82rem;color:var(--muted)} .cust .r{text-align:right}
.chip{display:inline-block;font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid}
.s-draft{color:var(--muted);border-color:var(--line)}
.s-sent{color:#b26a00;border-color:#e0a54a;background:#fff4e0}
.s-deposited{color:#1d5fa8;border-color:#7fb0e6;background:#eaf3fd}
.s-paid{color:var(--good);border-color:#8fc79a;background:#eaf6ec}
.k-pending{color:#8a4f00;border-color:#e0a54a;background:#fff4e0}
.k-deposit{color:#1d5fa8;border-color:#7fb0e6;background:#eaf3fd}
.k-soon{color:#6a3fb0;border-color:#b9a0e6;background:#f3eefc}
.k-serving{color:#fff;border-color:#2e7d32;background:#2e7d32}
.k-done{color:#5b6b5d;border-color:#c9d3ca;background:#f1f4f1}
.k-cancelled{color:var(--bad);border-color:#e6a19c;background:#fdeceb}
.seg-chip{color:var(--muted);border-color:var(--line);background:var(--field)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.filters button{min-height:34px;padding:0 11px;border-radius:999px;font:600 12.5px var(--body);cursor:pointer;background:var(--field);color:var(--ink);border:1px solid var(--line)}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.s-cancelled{color:var(--bad);border-color:#e6a19c;background:#fdeceb;text-decoration:line-through}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{background:transparent}}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;font-size:.85rem}
.money div{background:var(--soft);border-radius:7px;padding:6px 8px;min-width:0}
.money b{display:block;font-size:.88rem;white-space:nowrap}
.pay{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;border-top:1px dashed var(--line);padding:6px 0}
.ck{display:flex;flex-direction:column;gap:2px}
.ck-item{border-top:1px solid var(--line)}
.ck-item:first-of-type{border-top:0}
.ck-line{display:flex;align-items:center;gap:10px;min-height:48px}
.ck-box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:#fff;color:#fff;font:700 17px/1 system-ui;cursor:pointer;display:grid;place-items:center;padding:0}
.ck-box[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.ck-name{flex:1;min-width:0;border:0;background:none;text-align:left;padding:8px 0;cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;gap:1px}
.ck-name b{font-size:.93rem;font-weight:600}
.ck-sum{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-sum:empty{display:none}
.ck-more{flex:none;width:36px;height:36px;border:0;border-radius:8px;background:none;color:var(--muted);font:700 18px/1 system-ui;cursor:pointer}
.ck-more:hover,.ck-name:hover b{color:var(--ink)}
.ck-box:focus-visible,.ck-name:focus-visible,.ck-more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.st-done .ck-name b{color:var(--muted)}
.st-skip .ck-name b{color:var(--muted);text-decoration:line-through}
.st-skip .ck-box{opacity:.35}
.ck-item.open{padding-bottom:10px}
.ck-item.open .ck-name b{color:var(--ink)}
.ck-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.ck-row input,.ck-row select{width:auto;min-width:0;padding:7px 9px;font-size:15px}
.ck-places{display:flex;flex-wrap:wrap;gap:6px}
.ck-places label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--ink);font-size:.85rem;cursor:pointer}
.ck-places input{width:18px;height:18px;margin:0;accent-color:var(--good)}
.pay .x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:.8rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:7;
  background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 16px;font-size:.88rem;opacity:0;pointer-events:none;
  transition:opacity .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}
[hidden]{display:none!important}
/* ── máy tính (≥1024px): danh sách khách bên trái, hồ sơ bên phải ── */
#vEmpty{display:none}
@media (min-width:1024px){
  .wrap{max-width:1240px}
  .wrap.split{display:grid;grid-template-columns:400px minmax(0,1fr);gap:20px;align-items:start}
  .wrap.split .tabs{grid-column:1/-1}
  .wrap.split #vList{grid-column:1;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;padding-right:4px}
  .wrap.split #vProfile,.wrap.split #vEmpty{grid-column:2}
  .wrap.split #vEmpty:not([hidden]){display:grid;place-items:center;min-height:300px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted)}
  #back{display:none}
  .cust[aria-current="true"]{border-color:var(--accent);background:var(--soft)}
}
.cust>b{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cust .arr{font-weight:600;color:var(--brown,#a9541f);white-space:nowrap}
</style>
</head>
<body>
<header class="top">
  <a href="index.html">☰ Menu</a>
  <h1>Khách hàng</h1>
</header>

<main class="wrap">
  <div class="tabs" role="tablist">
    <button type="button" id="tabCust" class="on">👥 Khách</button>
    <button type="button" id="tabFollow">📌 Cần theo dõi</button>
  </div>

  <!-- ── danh sách khách ── -->
  <section id="vList">
    <div class="row" style="margin-bottom:10px">
      <input id="q" type="search" placeholder="Tìm tên, số điện thoại hoặc mã KH" style="flex:1" autocomplete="off">
      <button type="button" class="btn primary" id="addOpen">➕ Thêm khách</button>
    </div>
    <form id="addForm" class="card" hidden>
      <div class="grid">
        <label>Tên khách<input id="aName" autocomplete="off"></label>
        <label>Số điện thoại<input id="aPhone" inputmode="tel" autocomplete="off"></label>
      </div>
      <label style="margin-top:10px">Ghi chú<input id="aNote" placeholder="Ví dụ: khách quen, đi 4 người, thích phòng view sông"></label>
      <p class="hint">Không ghi số CCCD, hộ chiếu hay giấy tờ tùy thân vào đây.</p>
      <div class="row" style="margin-top:10px">
        <button type="submit" class="btn primary">Lưu khách</button>
        <button type="button" class="btn ghost" id="addCancel">Hủy</button>
        <span id="addErr" class="err"></span>
      </div>
    </form>
    <div class="filters" id="fStatus" role="group" aria-label="Trạng thái khách"></div>
    <div class="filters" id="fSeg" role="group" aria-label="Nhóm khách"></div>
    <div id="custList"><p class="hint">⏳ Đang tải…</p></div>
  </section>

  <!-- ── hồ sơ một khách ── -->
  <section id="vProfile" hidden>
    <button type="button" class="btn ghost small" id="back">← Danh sách khách</button>
    <div id="profile"></div>
  </section>

  <!-- ── cần theo dõi ── -->
  <section id="vEmpty" hidden><p>Chọn một khách bên trái để xem hồ sơ</p></section>

  <section id="vFollow" hidden>
    <div id="follow"><p class="hint">⏳ Đang tải…</p></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' đ';
const fmtD=v=>{if(!v)return'';const[y,m,d]=String(v).slice(0,10).split('-');return`${d}/${m}/${y}`;};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
// same rule as norm_phone() in the database
const normPhone=p=>{const d=String(p||'').replace(/\D/g,'');return /^84\d{9}$/.test(d)?'0'+d.slice(2):d;};
const STATE={draft:'Nháp',sent:'Chờ cọc',deposited:'Đã cọc',paid:'✓ Hoàn thành',cancelled:'Đã hủy'};
const chip=s=>`<span class="chip s-${esc(s)}">${esc(STATE[s]||s)}</span>`;
const billName=b=>b.kind==='combo'?'Combo '+b.ref:'Hóa đơn '+(b.detail?'phòng '+b.detail:'phòng/xe');
const editorUrl=b=>(b.kind==='combo'?'combo.html':'vi.html')+'?open='+encodeURIComponent(b.ref);
const table=b=>b.kind==='combo'?'combos?code=eq.':'invoices?id=eq.';
let toastT=null;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800);}
function errText(e){return /does not exist|schema cache|Could not find/i.test(e.message)
  ?'Database chưa được nâng cấp: chạy file supabase/002_khach_thu_tien.sql trên Supabase trước.':e.message;}

// ── điều hướng: #KH-0001 mở hồ sơ, #follow mở tab theo dõi ──
const wide=window.matchMedia('(min-width:1024px)');
function show(view){
  const w=wide.matches;
  document.querySelector('main.wrap').classList.toggle('split',view!=='follow');
  $('vList').hidden=!(view==='list'||(w&&view==='profile')); $('vProfile').hidden=view!=='profile'; $('vFollow').hidden=view!=='follow';
  $('vEmpty').hidden=!(w&&view==='list');
  $('tabCust').classList.toggle('on',view!=='follow'); $('tabFollow').classList.toggle('on',view==='follow');
}
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(/^KH-\d+$/.test(h)){ show('profile'); loadProfile(h); if(wide.matches) loadList(); }
  else if(h==='follow'){ show('follow'); loadFollow(); }
  else if(h==='new'){ show('list'); loadList(); $('addOpen').click(); history.replaceState(null,'',location.pathname); }
  else { show('list'); loadList(); }
}
window.addEventListener('hashchange',route);
wide.addEventListener('change',route);
$('tabCust').onclick=()=>{ location.hash=''; };
$('tabFollow').onclick=()=>{ location.hash='follow'; };
$('back').onclick=()=>{ location.hash=''; };

// ── trạng thái khách (tự tính từ hóa đơn + ngày đến/đi) và nhóm khách (chọn tay) ──
const KSTATE={pending:'Chưa chốt',deposit:'Đã cọc',soon:'Đã cọc, sắp tới',serving:'Đang phục vụ',done:'Đã hoàn thành',cancelled:'Đã hủy'};
const SEGS={combo:'Combo',xe_may:'Chỉ thuê xe máy',phong_xe:'Thuê phòng và xe máy'};
// "Đã cọc, sắp tới": báo trước khi khách đến
const SOON_DAYS=5;
const addDaysIso=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
// one stage per bill, then the guest takes the most pressing one
function custStatus(bills){
  const t=today(), soon=addDaysIso(SOON_DAYS), rank=['serving','soon','deposit','pending','done'];
  const live=bills.filter(b=>b.state!=='cancelled');
  if(!live.length) return bills.length?'cancelled':'pending';
  const stages=live.map(b=>{
    const st=b.start_date, en=b.end_date||b.start_date;
    if(Number(b.paid)>0){
      if(st&&t>=st&&(!en||t<=en)) return 'serving';
      if(en&&t>en) return 'done';
      if(st&&st<=soon) return 'soon';
      return 'deposit';
    }
    if(en&&t>en) return null;          // hóa đơn cũ chưa cọc, đã qua ngày: bỏ qua
    return 'pending';
  }).filter(Boolean);
  if(!stages.length) return 'pending';
  return rank.find(r=>stages.includes(r));
}
// ngày đến hiển thị cạnh tên: chuyến đang/sắp tới gần nhất, không có thì chuyến gần nhất đã qua
function arrival(bills){
  const t=today(), live=bills.filter(b=>b.state!=='cancelled'&&b.start_date);
  const key=b=>b.start_date+(b.via_bus?'0':'1');   // cùng ngày: ưu tiên ghi "bus"
  const up=live.filter(b=>(b.end_date||b.start_date)>=t).sort((a,b)=>key(a)<key(b)?-1:1);
  const pick=up[0]||live.sort((a,b)=>key(a)<key(b)?-1:1).pop();
  return pick?{d:pick.start_date,bus:!!pick.via_bus}:null;
}
const ddmm=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'';
const kchip=k=>`<span class="chip k-${k}">${KSTATE[k]}</span>`;
const segchip=v=>v?`<span class="chip seg-chip">${esc(SEGS[v]||v)}</span>`:'';
let fStatus='all', fSeg='all', listRows=[];
function drawFilters(){
  const mk=(box,defs,cur,set)=>{ $(box).innerHTML=defs.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${v===cur}">${l}</button>`).join('');
    $(box).onclick=e=>{const b=e.target.closest('button'); if(b){ set(b.dataset.v); drawFilters(); drawList(); }}; };
  mk('fStatus',[['all','Mọi trạng thái'],...['pending','deposit','soon','serving','done'].map(k=>[k,KSTATE[k]])],fStatus,v=>fStatus=v);
  mk('fSeg',[['all','Mọi nhóm'],...Object.entries(SEGS),['none','Chưa phân nhóm']],fSeg,v=>fSeg=v);
}
// ── icon con vật: không trùng giữa các khách chưa hoàn thành chuyến ──
async function avatarUse(){
  const [cs,bs]=await Promise.all([sb('customers?select=id,avatar&deleted_at=is.null&avatar=not.is.null&limit=2000'),
    sb('bills?select=customer_id,state,start_date,end_date,paid&customer_id=not.is.null&limit=5000')]);
  const by={}; bs.forEach(b=>(by[b.customer_id]=by[b.customer_id]||[]).push(b));
  const used=new Map(), counts={};
  cs.forEach(c=>{ counts[c.avatar]=(counts[c.avatar]||0)+1; const k=custStatus(by[c.id]||[]); if(k!=='done'&&k!=='cancelled') used.set(c.avatar,c.id); });
  return {used,counts};
}
async function ensureAvatars(rows){
  const need=rows.filter(c=>'avatar' in c && !c.avatar); if(!need.length) return;
  try{
    const {used,counts}=await avatarUse();
    for(const c of need){
      const k=pickAnimal(new Set(used.keys()),counts); used.set(k,c.id); counts[k]=(counts[k]||0)+1;
      await sb('customers?id=eq.'+encodeURIComponent(c.id)+'&avatar=is.null',{method:'PATCH',prefer:'return=minimal',body:{avatar:k}});
      c.avatar=k;
    }
  }catch(e){}
}
function drawList(){
  const box=$('custList'), q=$('q').value.trim();
  const rows=listRows.filter(c=>(fStatus==='all'||c.k===fStatus)&&(fSeg==='all'||(fSeg==='none'?!c.segment:c.segment===fSeg)));
  if(!rows.length){ box.innerHTML=`<p class="hint">${q||fStatus!=='all'||fSeg!=='all'?'Không có khách nào khớp.':'Chưa có khách nào. Bấm ➕ Thêm khách.'}</p>`; return; }
  const curId=decodeURIComponent(location.hash.slice(1));
  box.innerHTML=rows.map(c=>`<a class="card cust" href="#${esc(c.id)}"${c.id===curId?' aria-current="true"':''} style="display:grid;text-decoration:none">
    <b>${avatarHtml(c,38)} ${esc(c.name||'(chưa có tên)')}${c.arr?` <span class="arr" title="${c.arr.bus?'Đến Cao Bằng bằng xe (sáng sớm)':'Ngày đến'}">· ${ddmm(c.arr.d)}${c.arr.bus?' bus':''}</span>`:''}</b><span class="r">${kchip(c.k)}</span>
    <span class="m">${esc(c.id)} · ${esc(c.phone||'chưa có số')}</span><span class="r">${segchip(c.segment)}</span></a>`).join('');
}

// ── danh sách + tìm kiếm ──
let qT=null;
$('q').addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(loadList,300);});
async function loadList(){
  const box=$('custList'), q=$('q').value.trim();
  let filter='';
  if(q){
    const parts=[`name.ilike.*${q.replace(/[*,()]/g,' ')}*`,`id.ilike.*${q.replace(/[*,()]/g,' ')}*`];
    const d=normPhone(q); if(d.length>=3) parts.push(`phone_norm.like.*${d}*`);
    filter='&or=('+parts.map(encodeURIComponent).join(',')+')';
  }
  try{
    const rows=await sb('customers?select=*&deleted_at=is.null&order=updated_at.desc&limit=100'+filter);
    const byC={};
    if(rows.length){
      const bills=await sb('bills?select=*&customer_id=in.('+rows.map(c=>encodeURIComponent(c.id)).join(',')+')');
      bills.forEach(b=>(byC[b.customer_id]=byC[b.customer_id]||[]).push(b));
    }

// ── checklist chuẩn bị cho khách: lưu ở customers.checklist (supabase/003_checklist.sql) ──
const BIKES=['Wave Alpha','Future','PG1','Vision','Air Blade','Winner','XR 150'];
const PLACES=["Ba Quáng (Đồi Cỏ)",'86 Homestay','Yến Nhi','A Thám','Mế Farmstay','Khuổi Ky'];
// each step: '' chưa · 'done' xong · 'skip' không cần
function ckDone(k){ return k.st==='done'||k.st==='skip'; }
function ckSteps(ck){
  const g=k=>ck[k]||{};
  return [
    {key:'bus_out', title:'Vé xe chiều đi', body:`<span>Số vé</span><input type="number" min="0" inputmode="numeric" data-ck="bus_out.qty" value="${esc(g('bus_out').qty??'')}" style="width:80px">`},
    {key:'bus_back', title:'Vé xe chiều về', body:`<span>Số vé</span><input type="number" min="0" inputmode="numeric" data-ck="bus_back.qty" value="${esc(g('bus_back').qty??'')}" style="width:80px">`},
    {key:'bike', title:'Xe máy', body:`<span>Loại</span><select data-ck="bike.type"><option value="">—</option>${BIKES.map(b=>`<option${g('bike').type===b?' selected':''}>${b}</option>`).join('')}</select>
      <span>Số lượng</span><input type="number" min="0" inputmode="numeric" data-ck="bike.qty" value="${esc(g('bike').qty??'')}" style="width:70px">`},
    {key:'room', title:"Khóa phòng tại Sen's", body:`<span>Phòng</span><input data-ck="room.detail" placeholder="Ví dụ: Beige, 05–07/11" value="${esc(g('room').detail||'')}" style="flex:1">`},
    {key:'other', title:'Đặt phòng điểm khác', body:`<div class="ck-places">${PLACES.map(p=>`<label><input type="checkbox" data-ckplace="${esc(p)}"${(g('other').places||[]).includes(p)?' checked':''}>${esc(p)}</label>`).join('')}</div>
      <input data-ck="other.note" placeholder="Ghi chú: phòng nào, đêm nào" value="${esc(g('other').note||'')}" style="flex:1;min-width:200px">`},
    {key:'early', title:'Khách đến sớm có nghỉ không', body:`<span>Giờ xe tới</span><input data-ck="early.time" placeholder="4:30" value="${esc(g('early').time||'')}" style="width:80px">`,
      doneLabel:'Có nghỉ sớm', skipLabel:'Không nghỉ'},
    {key:'taxi', title:'Đặt taxi', body:`<span>Chi tiết</span><input data-ck="taxi.detail" placeholder="Giờ, đón ở đâu → đi đâu" value="${esc(g('taxi').detail||'')}" style="flex:1;min-width:180px">`},
  ];
}
// tóm tắt 1 dòng cho mỗi việc
function ckSummary(key,o){
  o=o||{}; const n=v=>v!==''&&v!=null;
  if(key==='bus_out'||key==='bus_back') return n(o.qty)?o.qty+' vé':'';
  if(key==='bike') return [o.type,n(o.qty)?o.qty+' xe':''].filter(Boolean).join(' · ');
  if(key==='room') return o.detail||'';
  if(key==='other') return [(o.places||[]).join(', '),o.note].filter(Boolean).join(' · ');
  if(key==='early') return o.time?'xe tới '+o.time:'';
  if(key==='taxi') return o.detail||'';
  return '';
}
let ckOpen=null;   // việc đang mở chi tiết (chỉ một)
function checklistCard(c){
  const ck=c.checklist;
  if(ck===undefined) return `<div class="card"><b>✅ Checklist chuẩn bị</b><p class="err" style="margin:6px 0 0">Cần chạy file supabase/003_checklist.sql trên Supabase để bật checklist.</p></div>`;
  const steps=ckSteps(ck), done=steps.filter(s=>ckDone(ck[s.key]||{})).length;
  const rank=s=>({'':0,done:1,skip:2})[(ck[s.key]||{}).st||'']??0;
  const sorted=steps.map((s,i)=>[s,i]).sort((a,b)=>rank(a[0])-rank(b[0])||a[1]-b[1]).map(x=>x[0]);
  return `<div class="card ck" id="ckCard">
    <div class="row" style="justify-content:space-between;margin-bottom:4px"><b>✅ Checklist chuẩn bị</b><span class="chip ${done===steps.length?'s-paid':'s-sent'}">${done}/${steps.length} xong</span></div>
    ${sorted.map(s=>{ const o=ck[s.key]||{}, st=o.st||'', open=ckOpen===s.key, sum=ckSummary(s.key,o);
      const label=st==='done'&&s.doneLabel?s.doneLabel:st==='skip'?(s.skipLabel||'Không cần'):'';
      return `<div class="ck-item st-${st||'todo'}${open?' open':''}">
        <div class="ck-line">
          <button type="button" class="ck-box" data-cktoggle="${s.key}" aria-pressed="${st==='done'}" aria-label="${esc(s.title)}: ${st==='done'?'đã xong, bấm để bỏ':'bấm khi đã xong'}">${st==='done'?'✓':''}</button>
          <button type="button" class="ck-name" data-ckopen="${s.key}" aria-expanded="${open}"><b>${esc(s.title)}</b><span class="ck-sum" data-cksum="${s.key}">${esc([label,sum].filter(Boolean).join(' · '))}</span></button>
          <button type="button" class="ck-more" data-ckskip="${s.key}" aria-pressed="${st==='skip'}" title="${st==='skip'?'Bỏ đánh dấu':(s.skipLabel||'Không cần')}" aria-label="${esc(s.title)}: ${st==='skip'?'bỏ đánh dấu không cần':(s.skipLabel||'không cần')}">${st==='skip'?'↺':'⋯'}</button>
        </div>
        ${open?`<div class="ck-row">${s.body}</div>`:''}
      </div>`; }).join('')}
    <p class="hint" id="ckSaved" style="margin:4px 0 0"></p>
  </div>`;
}
let ckT=null;
function saveChecklist(){
  clearTimeout(ckT); $('ckSaved').textContent='…';
  ckT=setTimeout(async()=>{
    try{ await sb('customers?id=eq.'+encodeURIComponent(cur.c.id),{method:'PATCH',prefer:'return=minimal',body:{checklist:cur.c.checklist}}); $('ckSaved').textContent='Đã lưu'; }
    catch(err){ $('ckSaved').textContent='Chưa lưu được: '+errText(err); }
  },500);
}
function wireChecklist(){
  const card=$('ckCard'); if(!card) return;
  const ck=cur.c.checklist, at=k=>(ck[k]=ck[k]||{});
  const redraw=save=>{ $('ckCard').outerHTML=checklistCard(cur.c); wireChecklist(); if(save) saveChecklist(); };
  card.querySelectorAll('[data-cktoggle]').forEach(b=>b.onclick=()=>{ const o=at(b.dataset.cktoggle); o.st=o.st==='done'?'':'done'; redraw(true); });
  card.querySelectorAll('[data-ckskip]').forEach(b=>b.onclick=()=>{ const o=at(b.dataset.ckskip); o.st=o.st==='skip'?'':'skip'; if(ckOpen===b.dataset.ckskip) ckOpen=null; redraw(true); });
  card.querySelectorAll('[data-ckopen]').forEach(b=>b.onclick=()=>{ ckOpen=ckOpen===b.dataset.ckopen?null:b.dataset.ckopen; redraw(false);
    const f=$('ckCard').querySelector('.ck-item.open input:not([type=checkbox]), .ck-item.open select'); if(f) f.focus({preventScroll:true}); });
  const resum=k=>{ const el=card.querySelector(`[data-cksum="${k}"]`); if(el) el.textContent=ckSummary(k,ck[k]); };
  card.querySelectorAll('[data-ck]').forEach(el=>el.addEventListener('input',()=>{
    const [k,f]=el.dataset.ck.split('.'); at(k)[f]=el.type==='number'?(el.value===''?'':Number(el.value)):el.value; resum(k); saveChecklist(); }));
  card.querySelectorAll('[data-ckplace]').forEach(el=>el.onchange=()=>{
    const o=at('other'), set=new Set(o.places||[]); el.checked?set.add(el.dataset.ckplace):set.delete(el.dataset.ckplace);
    o.places=[...set]; resum('other'); saveChecklist(); });
}
function billCard(b,i,pays){

          <button type="button" class="btn ghost small" data-act="pay" data-i="${i}">💵 Thu một phần</button>`
        :`<button type="button" class="btn primary small" data-act="pay" data-i="${i}">💵 Ghi thu tiền</button>`}

        :`<button type="button" class="btn danger small" data-act="cancel" data-i="${i}">Hủy</button>`}

async function onBillAction(e){
  const el=e.currentTarget, act=el.dataset.act, b=cur.bills[el.dataset.i];
  try{
    if(act==='pay'){ const f=document.querySelector(`[data-payform="${el.dataset.i}"]`); f.hidden=!f.hidden; f.onsubmit=ev=>savePay(ev,b); if(!f.hidden) f.amount.focus(); return; }
    if(act==='payall'){ if(!confirm(`Ghi đã thu nốt ${money(b.remaining)} hôm nay cho ${billName(b)}?`)) return;
      await sb('payments',{method:'POST',prefer:'return=minimal',body:{customer_id:cur.c.id,
        invoice_id:b.kind==='invoice'?b.ref:null, combo_code:b.kind==='combo'?b.ref:null,
        amount:Math.round(Number(b.remaining)), paid_on:today(), account:'', note:'thu nốt'}});
      toast('Đã thu đủ · hoàn thành'); }
    if(act==='sent') await sb(table(b)+encodeURIComponent(b.ref),{method:'PATCH',prefer:'return=minimal',body:{status:'final'}});
    if(act==='cancel'){ if(!confirm('Hủy '+billName(b)+'? Có thể khôi phục lại sau.')) return;
      await sb(table(b)+encodeURIComponent(b.ref),{method:'PATCH',prefer:'return=minimal',body:{cancelled_at:new Date().toISOString()}}); }
    if(act==='uncancel') await sb(table(b)+encodeURIComponent(b.ref),{method:'PATCH',prefer:'return=minimal',body:{cancelled_at:null}});
    if(act==='unpay'){ if(!confirm('Xoá khoản thu này? (dùng khi ghi nhầm)')) return;
      await sb('payments?id=eq.'+encodeURIComponent(el.dataset.p),{method:'PATCH',prefer:'return=minimal',body:{deleted_at:new Date().toISOString()}}); }
    loadProfile(cur.c.id);
  }catch(err){ toast('Lỗi: '+errText(err)); }
}
async function savePay(ev,b){
  ev.preventDefault(); const f=ev.target, out=f.querySelector('[data-payerr]');
  let amt=parseInt(String(f.amount.value).replace(/\D/g,''),10)||0;
  if(!amt){ out.textContent='Nhập số tiền.'; return; }
  if(f.refund.checked) amt=-amt;
  try{
    await sb('payments',{method:'POST',prefer:'return=minimal',body:{customer_id:cur.c.id,
      invoice_id:b.kind==='invoice'?b.ref:null, combo_code:b.kind==='combo'?b.ref:null,
      amount:amt, paid_on:f.paid_on.value||today(), account:f.account.value.trim(), note:f.note.value.trim()}});
    toast('Đã ghi '+money(Math.abs(amt))); loadProfile(cur.c.id);
  }catch(err){ out.textContent=errText(err); }
}
// "Xoá" chỉ ẩn (deleted_at), giống hóa đơn: khôi phục được trong Supabase
async function deleteCustomer(){
  const {c,bills}=cur, n=bills.length;
  if(!confirm(`Xoá khách ${c.id} · ${c.name||''}?`+(n?`\nCả ${n} hóa đơn và các khoản thu của khách cũng bị ẩn khỏi app.`:'')+'\n(Vẫn khôi phục được trong Supabase.)')) return;
  const now={deleted_at:new Date().toISOString()};
  try{
    for(const b of bills) await sb(table(b)+encodeURIComponent(b.ref),{method:'PATCH',prefer:'return=minimal',body:now});
    await sb('payments?customer_id=eq.'+encodeURIComponent(c.id)+'&deleted_at=is.null',{method:'PATCH',prefer:'return=minimal',body:now});
    await sb('customers?id=eq.'+encodeURIComponent(c.id),{method:'PATCH',prefer:'return=minimal',body:now});
    toast('Đã xoá '+c.id); location.hash='';
  }catch(err){ toast('Lỗi: '+errText(err)); }
}
async function saveCustomer(e){
  e.preventDefault();
  const body={name:$('eName').value.trim(),phone:$('ePhone').value.trim(),note:$('eNote').value.trim()};
  try{ await sb('customers?id=eq.'+encodeURIComponent(cur.c.id),{method:'PATCH',prefer:'return=minimal',body}); toast('Đã lưu'); loadProfile(cur.c.id); }
  catch(err){ $('eErr').textContent=/duplicate|unique/i.test(err.message)?'Số điện thoại này đã thuộc về khách khác.':errText(err); }
}
// hóa đơn cũ chưa gắn khách nhưng cùng số điện thoại hoặc cùng tên → gợi ý gắn
async function loadUnlinked(){
  const {c}=cur, ph=normPhone(c.phone), nm=(c.name||'').trim().toLowerCase();
  if(!ph&&!nm) return;
  try{
    const rows=await sb('bills?select=*&customer_id=is.null&order=updated_at.desc&limit=300');
    const hits=rows.filter(b=>(ph&&normPhone(b.phone)===ph)||(nm&&(b.guest||'').trim().toLowerCase()===nm));
    if(!hits.length) return;
    $('unlinked').innerHTML=`<h2>Hóa đơn cũ có thể của khách này</h2><p class="hint">Trùng số điện thoại hoặc tên, nhưng chưa gắn mã khách.</p>`+
      hits.map((b,i)=>`<div class="card row" style="justify-content:space-between"><span><b>${esc(billName(b))}</b><br><span class="hint">${esc(b.guest)} · ${esc(b.phone)} · ${money(b.total)}</span></span>
      <button type="button" class="btn ghost small" data-link="${i}">Gắn vào ${esc(c.id)}</button></div>`).join('');
    $('unlinked').querySelectorAll('[data-link]').forEach(el=>el.onclick=async()=>{
      const b=hits[el.dataset.link];
      try{ await sb(table(b)+encodeURIComponent(b.ref),{method:'PATCH',prefer:'return=minimal',body:{customer_id:c.id}}); toast('Đã gắn'); loadProfile(c.id); }
      catch(err){ toast('Lỗi: '+errText(err)); }
    });
  }catch(e){}
}

// ── cần theo dõi: chờ cọc, đã cọc còn thu, nháp gần đây ──
async function loadFollow(){
  const box=$('follow'); box.innerHTML='<p class="hint">⏳ Đang tải…</p>';
  try{
    const rows=await sb('bills?select=*&state=in.(sent,deposited,draft)&order=start_date.asc.nullslast&limit=300');
    const t0=today(), t7=(()=>{const d=new Date();d.setDate(d.getDate()+7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
    const soon=await sb('bills?select=*&state=in.(draft,sent,deposited)&start_date=gte.'+t0+'&start_date=lte.'+t7+'&order=start_date.asc');
    const ids=[...new Set(rows.concat(soon).map(r=>r.customer_id).filter(Boolean))];
    const names={}, custs={};
    if(ids.length) (await sb('customers?select=*&id=in.('+ids.map(encodeURIComponent).join(',')+')')).forEach(c=>{names[c.id]=c.name; custs[c.id]=c;});
    const group=(st,title,hint)=>{ const g=st==='soon'?soon:rows.filter(r=>r.state===st&&(st!=='draft'||Number(r.total)>0)); if(!g.length) return '';
      return `<h2>${title} (${g.length})</h2><p class="hint">${hint}</p>`+g.map(b=>`<div class="card" style="padding:0;display:flex;align-items:stretch"><a class="cust" style="display:grid;text-decoration:none;flex:1;padding:12px 14px"
        href="${b.customer_id?'#'+esc(b.customer_id):editorUrl(b)}">
        <b>${avatarHtml(custs[b.customer_id]||{id:b.customer_id||b.ref,name:b.guest},36)} ${esc(names[b.customer_id]||b.guest||'(chưa có tên)')}</b><span class="r">${chip(b.state)}</span>
        <span class="m">${esc(billName(b))}${b.start_date?' · '+esc(fmtD(b.start_date)):''}</span>
        <span class="r m">còn ${money(b.remaining)}</span>
        ${b.customer_id?'':'<span class="m err" style="grid-column:1/-1">Chưa gắn mã khách</span>'}</a>
        <button type="button" class="x-del" data-kind="${b.kind}" data-ref="${esc(b.ref)}" data-name="${esc(billName(b))}" aria-label="Xoá ${esc(billName(b))}" style="border:0;border-left:1px solid var(--line);background:none;color:var(--bad);padding:0 14px;cursor:pointer;font:600 13px var(--body)">Xoá</button></div>`).join(''); };
    box.innerHTML=(group('soon','🚌 Sắp đến (7 ngày tới)','Chuẩn bị phòng, đón xe, nhắc khách mang theo phần tiền còn lại.')+group('sent','⏳ Chờ cọc','Đã gửi hóa đơn, chưa nhận đồng nào — nhắn lại khách.')+
      group('deposited','💰 Đã cọc, còn phải thu','Thu nốt khi khách đến hoặc trước ngày đi. Thu đủ là hóa đơn tự chuyển sang Hoàn thành và rời khỏi danh sách này.')+
      group('draft','📝 Nháp','Hóa đơn chưa gửi khách.'))||'<p class="hint">Không có hóa đơn nào cần theo dõi. 🎉</p>';
    box.querySelectorAll('.x-del').forEach(el=>el.onclick=async()=>{
      if(!confirm('Xoá '+el.dataset.name+' khỏi danh sách?\n(Hóa đơn bị ẩn khỏi app, vẫn khôi phục được trong Supabase.)')) return;
      try{ await sb(table({kind:el.dataset.kind})+encodeURIComponent(el.dataset.ref),{method:'PATCH',prefer:'return=minimal',body:{deleted_at:new Date().toISOString()}}); toast('Đã xoá'); loadFollow(); }
      catch(err){ toast('Lỗi: '+errText(err)); }
    });
  }catch(e){ box.innerHTML=`<p class="err">${esc(errText(e))}</p>`; }
}
document.body.insertAdjacentHTML('beforeend','<datalist id="accts"><option value="Chuyển khoản"><option value="Tiền mặt"></datalist>');
route();
</script>
