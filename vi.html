<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sen's Hóa Đơn</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
  --navy: #1e2d40;
  --gold: #c9a84c;
  --gold-light: #e8d5a3;
  --gold-bg: #fdf6e3;
  --red: #c0392b;
  --text: #2c2c2c;
  --muted: #999;
  --border: #e5ddd0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #f0ece4;
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
}

/* TOPBAR */
.topbar {
  background: var(--navy); color: #fff;
  padding: 0 16px; height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 200;
}
.topbar-logo { display: flex; align-items: center; gap: 8px; }
.topbar-icon {
  width: 30px; height: 30px; background: var(--gold);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
}
.topbar-icon svg { width: 16px; height: 16px; fill: #fff; }
.topbar-name { font-family: 'Playfair Display', serif; font-size: 15px; }
.topbar-name span { color: var(--gold); }

/* TABS */
.tabs {
  display: flex; background: #fff;
  border-bottom: 2px solid var(--border);
  position: sticky; top: 52px; z-index: 150;
}
.tab {
  flex: 1; padding: 12px 0; text-align: center;
  font-size: 13px; font-weight: 600; color: var(--muted);
  cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
  transition: all .2s;
}
.tab.active { color: var(--navy); border-bottom-color: var(--gold); }

/* PANELS */
.panel { display: none; }
.panel.active { display: block; }

/* FORM */
.form-body { padding: 12px 14px; }

.card {
  background: #fff; border-radius: 12px;
  margin-bottom: 10px; overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.card-head {
  background: var(--navy); color: #fff; padding: 10px 14px;
  font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
}
.card-body { padding: 12px 14px; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

label { font-size: 11px; color: #777; margin-bottom: 3px; display: block; font-weight: 500; }
input, select, textarea {
  width: 100%; padding: 10px 12px; border: 1.5px solid #e0d8cc;
  border-radius: 8px; font-size: 14px; font-family: 'DM Sans', sans-serif;
  color: var(--text); background: #fafaf8;
  -webkit-appearance: none; appearance: none;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--gold); background: #fff;
}
.field { margin-bottom: 8px; }

/* presets */
.preset-group { margin-bottom: 8px; border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; }
.preset-group-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 12px; background: var(--gold-bg); cursor: pointer;
  font-size: 12px; font-weight: 700; color: var(--navy); user-select: none;
}
.preset-group-head .arrow { font-size: 10px; color: var(--muted); transition: transform .2s; }
.preset-group-head.open .arrow { transform: rotate(180deg); }
.preset-group-body { display: none; padding: 10px 12px; background: #fff; }
.preset-group-body.open { display: block; }
.preset-sub-label { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .8px; margin: 8px 0 5px; }
.preset-sub-label:first-child { margin-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 7px 12px; border: 1.5px solid var(--gold-light);
  border-radius: 20px; font-size: 12px; cursor: pointer;
  background: var(--gold-bg); color: var(--navy); font-weight: 500;
  transition: background .15s; user-select: none;
}
.chip:active { background: var(--navy); color: #fff; border-color: var(--navy); }

/* items */
.item-card {
  border: 1.5px solid #ede8dc; border-radius: 10px;
  margin-bottom: 8px; overflow: hidden;
}
.item-head {
  background: var(--gold-bg); padding: 8px 12px;
  display: flex; align-items: center; gap: 8px;
}
.item-label { font-size: 12px; font-weight: 700; color: var(--navy); flex: 1; }
.item-subtotal { font-size: 12px; font-weight: 700; color: var(--gold); }
.x-btn { background: none; border: none; color: #bbb; font-size: 20px; cursor: pointer; padding: 0; line-height: 1; }
.x-btn:active { color: var(--red); }

.item-body { padding: 10px 12px; background: #fff; }

.subrow { display: grid; grid-template-columns: 1fr 60px 90px 26px; gap: 5px; margin-bottom: 5px; align-items: center; }
.subrow input { padding: 8px 9px; font-size: 13px; }

.col-lbl { display: grid; grid-template-columns: 1fr 60px 90px 26px; gap: 5px; margin-bottom: 4px; }
.col-lbl span { font-size: 10px; color: var(--muted); }

.disc-row {
  display: flex; align-items: center; gap: 6px;
  margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
  flex-wrap: wrap;
}
.disc-row label { font-size: 11px; color: #777; margin: 0; white-space: nowrap; }
.disc-input-wrap { display: flex; align-items: center; gap: 4px; }
.disc-input-wrap input { width: 64px; padding: 6px 8px; font-size: 13px; text-align: center; }
.disc-input-wrap span { font-size: 12px; color: var(--muted); }
.disc-saving { font-size: 11px; color: var(--red); font-weight: 600; margin-left: auto; }
.unit-wrap { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.unit-wrap label { font-size: 11px; color: #777; margin: 0; white-space: nowrap; }
.unit-wrap input { width: 72px; padding: 6px 8px; font-size: 13px; text-align: center; }

.add-item-btn {
  width: 100%; padding: 13px; background: #fff;
  border: 2px dashed var(--gold); border-radius: 10px;
  font-size: 14px; font-weight: 600; color: var(--gold);
  cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 2px;
}

/* summary */
.summary-bar {
  background: var(--navy); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.s-lbl { color: rgba(255,255,255,.6); font-size: 11px; margin-bottom: 2px; }
.s-val { color: var(--gold); font-size: 20px; font-weight: 700; }
.s-val2 { color: #fff; font-size: 16px; font-weight: 700; }
.s-usd { color: rgba(255,255,255,.55); font-size: 12px; margin-top: 2px; }

/* PREVIEW */
.preview-panel { padding: 14px; display: flex; flex-direction: column; align-items: center; }
.preview-wrap {
  width: 100%; background: #fff; border-radius: 12px; overflow: hidden;
  box-shadow: 0 2px 20px rgba(0,0,0,.12);
}
.preview-inner { width: 480px; transform-origin: top left; }

/* BOTTOM BAR */
.action-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #fff; border-top: 1px solid var(--border);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  display: flex; gap: 8px; z-index: 300;
}
.a-btn {
  flex: 1; padding: 14px 0; border: none; border-radius: 10px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  font-family: 'DM Sans', sans-serif;
}
.a-btn:active { opacity: .8; }
.a-primary { background: var(--navy); color: #fff; }
.a-gold { background: var(--gold); color: #fff; }
.a-ghost { background: var(--gold-bg); color: var(--navy); flex: 0 0 48px; font-size: 18px; }

/* LOADING */
#loading {
  display: none; position: fixed; inset: 0;
  background: rgba(30,45,64,.75); z-index: 999;
  align-items: center; justify-content: center; flex-direction: column; gap: 12px;
}
#loading.show { display: flex; }
.spinner { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--gold); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading p { color: #fff; font-size: 13px; }

/* HIDDEN EXPORT */
#inv-export {
  position: fixed; left: -9999px; top: 0;
  width: 480px; background: #fff;
  font-family: 'DM Sans', sans-serif;
}

/* INVOICE SHARED STYLES */
.inv-pad {
  padding: 28px 24px 40px; position: relative;
  overflow: hidden; background: #fff;
}
.inv-topbar {
  position: absolute; top: 0; left: 0; right: 0; height: 5px;
  background: linear-gradient(90deg, var(--navy) 60%, var(--gold) 100%);
}
.inv-corner {
  position: absolute; bottom: 0; right: 0; width: 0; height: 0; border-style: solid;
  border-width: 0 56px 56px 0; border-color: transparent var(--gold) transparent transparent;
}
.inv-hdr {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px; padding-bottom: 14px;
  border-bottom: 1.5px solid var(--border);
}
.inv-logo { display: flex; align-items: center; gap: 9px; }
.inv-logo-c {
  width: 36px; height: 36px; background: var(--navy); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.inv-logo-c svg { width: 18px; height: 18px; fill: #fff; }
.inv-brand { font-size: 14.5px; font-weight: 800; color: var(--navy); letter-spacing: .8px; line-height: 1.25; }
.inv-brand-s { font-size: 10px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; }
.inv-contact { text-align: right; font-size: 10.5px; color: #777; line-height: 1.8; }
.inv-title-row {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 4px;
}
.inv-title {
  font-family: 'Playfair Display', serif; font-size: 44px;
  color: var(--navy); letter-spacing: -1px; line-height: 1;
}
.inv-guest-box { text-align: right; }
.inv-guest-box .lbl { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
.inv-guest-box .val { font-size: 16.5px; font-weight: 700; color: var(--navy); display: block; margin-top: 1px; }
.inv-disc {
  font-size: 10.5px; font-style: italic; color: #aaa;
  margin-bottom: 12px; letter-spacing: .2px;
}
.inv-meta {
  display: flex; flex-wrap: wrap; gap: 8px 16px;
  margin-bottom: 14px;
  background: var(--gold-bg); border-radius: 8px;
  padding: 8px 12px; font-size: 12px; color: #555;
}
.inv-meta strong { color: var(--navy); }
.inv-tbl { width: 100%; border-collapse: collapse; }
.inv-tbl th {
  background: var(--navy); color: #fff; font-size: 11px;
  font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
  padding: 9px 10px; text-align: left;
}
.inv-tbl th:last-child { text-align: right; width: 100px; }
.inv-tbl td {
  padding: 10px 10px; font-size: 13px;
  border-bottom: 1px solid var(--border); vertical-align: top;
}
.inv-tbl td:last-child { text-align: right; font-weight: 700; color: var(--navy); white-space: nowrap; }
.inv-tbl tr:last-child td { border-bottom: none; }
.inv-tbl tr:nth-child(even) td { background: #fdfcf8; }
.inv-item-name { font-weight: 700; color: var(--navy); font-size: 13px; display: block; }
.inv-item-meta { font-size: 11px; color: #999; margin-top: 2px; display: block; }
.inv-item-note { font-size: 11px; color: #aaa; font-style: italic; margin-top: 2px; display: block; }
.inv-item-disc { font-size: 11px; color: var(--red); margin-top: 2px; display: block; }
.inv-total-box {
  background: var(--navy); border-radius: 10px;
  padding: 14px 16px; margin-top: 16px;
  display: flex; justify-content: space-between; align-items: center;
}
.inv-tot-lbl { font-family: 'Playfair Display', serif; font-size: 24px; color: #fff; }
.inv-tot-right { text-align: right; }
.inv-tot-val { font-size: 22px; font-weight: 700; color: var(--gold); }
.inv-tot-usd { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 2px; }
.inv-dep {
  background: var(--gold-bg); border: 1px solid var(--gold-light);
  border-radius: 8px; padding: 10px 14px; font-size: 12.5px; margin-top: 10px;
}
.inv-dep-row { display: flex; justify-content: space-between; margin-bottom: 4px; color: #666; }
.inv-dep-final {
  font-size: 14.5px; font-weight: 700; color: var(--red);
  border-top: 1px dashed var(--gold-light); padding-top: 7px; margin-top: 5px;
  display: flex; justify-content: space-between; align-items: baseline;
}
.inv-note {
  margin-top: 10px; font-size: 11.5px; color: #999; font-style: italic;
  padding: 8px 12px; border-radius: 6px;
  background: #fafafa; border-left: 3px solid var(--gold-light);
}
.inv-stamp {
  margin-top: 20px; text-align: center;
  font-size: 10px; color: #ccc; letter-spacing: 1px; text-transform: uppercase;
}
.sline { display: block; line-height: 1.6; }
</style>
</head>

<div id="loading"><div class="spinner"></div><p>Đang tạo ảnh...</p></div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-logo">
    <div class="topbar-icon"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
    <div class="topbar-name"><span>Sen's</span> Hóa Đơn</div>
  </div>
  <div style="display:flex;gap:6px;align-items:center">
    <a href="index.html" style="background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 10px;border-radius:6px;font-size:13px;cursor:pointer;text-decoration:none">🇬🇧</a>
    <button onclick="resetForm()" style="background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer">🔄</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" id="tab-form" onclick="switchTab('form')">✏️ Nhập liệu</div>
  <div class="tab" id="tab-preview" onclick="switchTab('preview')">👁 Xem trước</div>
</div>

<!-- ── FORM PANEL ── -->
<div class="panel active" id="panel-form">
<div class="form-body">

  <div class="summary-bar">
    <div>
      <div class="s-lbl">Tổng tiền</div>
      <div class="s-val" id="s-total">0 đ</div>
      <div class="s-usd" id="s-usd"></div>
    </div>
    <div style="text-align:right"><div class="s-lbl">Còn lại</div><div class="s-val2" id="s-remain">—</div></div>
  </div>

  <div class="card">
    <div class="card-head">🏠 Thông tin khách</div>
    <div class="card-body">
      <div class="field"><label>Tên khách</label>
        <input type="text" id="f-guest" placeholder="Ví dụ: Nguyễn Văn A" oninput="render()"></div>
      <div class="row2">
        <div class="field"><label>Phòng</label>
          <input type="text" id="f-room" placeholder="Phòng 103" oninput="render()"></div>
        <div class="field"><label>Số đêm</label>
          <input type="text" id="f-nights" readonly style="background:#f5f5f5;color:#aaa;font-size:13px"></div>
      </div>
      <div class="row2">
        <div class="field"><label>📅 Nhận phòng</label>
          <input type="date" id="f-checkin" oninput="calcNights();render()"></div>
        <div class="field"><label>📅 Trả phòng</label>
          <input type="date" id="f-checkout" oninput="calcNights();render()"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">⚡ Thêm nhanh</div>
    <div class="card-body"><div class="presets" id="presets"></div></div>
  </div>

  <div class="card">
    <div class="card-head">📋 Dịch vụ</div>
    <div class="card-body" style="padding-bottom:8px">
      <div id="items-con"></div>
      <button class="add-item-btn" onclick="addItem()">+ Thêm mục mới</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head">💰 Thanh toán & Ghi chú</div>
    <div class="card-body">
      <div class="field"><label>Tỷ giá (VNĐ / 1 USD)</label>
        <input type="number" id="f-rate" value="26323" min="1" inputmode="numeric" oninput="render()"></div>
      <div class="field"><label>Tiền cọc đã nhận (VNĐ)</label>
        <input type="number" id="f-deposit" placeholder="0" min="0" inputmode="numeric" oninput="render()"></div>
      <div class="field"><label>Ghi chú (tuỳ chọn)</label>
        <textarea id="f-note" rows="2" placeholder="Đã thanh toán vé xe..." oninput="render()" style="resize:none;font-size:13px"></textarea></div>
    </div>
  </div>

</div>
</div>

<!-- ── PREVIEW PANEL ── -->
<div class="panel" id="panel-preview">
  <div class="preview-panel">
    <div class="preview-wrap" id="preview-wrap">
      <div class="preview-inner" id="preview-inner"></div>
    </div>
    <p style="font-size:11px;color:#aaa;margin-top:10px;text-align:center">Xem trước thu nhỏ · Ảnh xuất đầy đủ độ nét</p>
  </div>
</div>

<!-- BOTTOM BAR -->
<div class="action-bar">
  <button class="a-btn a-ghost" id="toggle-btn" onclick="toggleTab()">👁</button>
  <button class="a-btn a-gold" onclick="downloadImage()">⬇ Tải PNG</button>
  <button class="a-btn a-primary" onclick="shareImage()">📤 Chia sẻ</button>
</div>

// ── TABS ──
function switchTab(t) {
  curTab = t;
  ['form','preview'].forEach(x => {
    document.getElementById('panel-'+x).classList.toggle('active', x===t);
    document.getElementById('tab-'+x).classList.toggle('active', x===t);
  });
  document.getElementById('toggle-btn').textContent = t==='form' ? '👁' : '✏️';
  if (t==='preview') { renderPreview(); scalePreview(); }
}
function toggleTab() { switchTab(curTab==='form'?'preview':'form'); }

// ── PRESETS ──
function buildPresets() {
  document.getElementById('presets').innerHTML = PRESET_GROUPS.map(g => {
    const bodyContent = g.subs
      ? g.subs.map(s =>
          `<div class="preset-sub-label">${s.label}</div>
           <div class="chips">${s.items.map(p => chipHTML(p)).join('')}</div>`
        ).join('')
      : `<div class="chips">${g.items.map(p => chipHTML(p)).join('')}</div>`;
    return `<div class="preset-group">
      <div class="preset-group-head" onclick="toggleGroup('${g.key}')">
        <span>${g.label}</span><span class="arrow">▼</span>
      </div>
      <div class="preset-group-body" id="pg-${g.key}">${bodyContent}</div>
    </div>`;
  }).join('');
}
function chipHTML(p) {
  return `<div class="chip" onclick='addPreset(${JSON.stringify(p)})'>${p.n}</div>`;
}
function toggleGroup(key) {
  const body = document.getElementById('pg-'+key);
  const head = body.previousElementSibling;
  const open = body.classList.toggle('open');
  head.classList.toggle('open', open);
}

// ── INIT ──
function init() {
  buildPresets();
  items.push({id:++idc, n:'Phòng (OTA)', q:1, u:'phòng', p:0, disc:0, note:''});
  drawForms(); render();
  window.addEventListener('resize', () => { if(curTab==='preview') scalePreview(); });
}

// ── ITEMS ──
function addPreset(p) {
  items.push({id:++idc, n:p.n, q:p.q, u:p.u||'', p:p.p, disc:0, note:''});
  drawForms(); render();
}
function addItem() {
  items.push({id:++idc, n:'', q:1, u:'', p:0, disc:0, note:''});
  drawForms(); render();
}
function removeItem(id) {
  items = items.filter(i=>i.id!==id);
  drawForms(); render();
}
function updDisc(id,v) {
  const it=items.find(i=>i.id===id);
  it.disc=Math.min(100,Math.max(0,parseFloat(v.replace(',','.'))||0));
  const el=document.getElementById('isub-'+id);
  if(el) el.textContent=fmtD(iSum(it));
  render();
}
function updCalcOnly(id,f,v) {
  const it=items.find(i=>i.id===id);
  if (!it) return;
  const num=parseFloat(String(v).replace(',','.'))||0;
  it[f]=num;
  const el=document.getElementById('isub-'+id);
  if(el) el.textContent=fmtD(iSum(it));
  render();
}
function upd(id,f,v) {
  const it=items.find(i=>i.id===id);
  if (f==='p'||f==='q') {
    const num=parseFloat(String(v).replace(',','.'))||0;
    it[f]=num;
  } else {
    it[f]=v;
  }
  const el=document.getElementById('isub-'+id);
  if(el) el.textContent=fmtD(iSum(it));
  render();
}
function iRaw(it) { return (it.q??1)*(it.p||0); }
function iSum(it) { return iRaw(it)*(1-(it.disc||0)/100); }

function drawForms() {
  document.getElementById('items-con').innerHTML = items.map((it,idx)=>{
    const s=iSum(it);
    return `<div class="item-card">
      <div class="item-head">
        <span class="item-label">Mục ${idx+1}</span>
        <span class="item-subtotal" id="isub-${it.id}">${fmtD(s)}</span>
        <button class="x-btn" onclick="removeItem(${it.id})">×</button>
      </div>
      <div class="item-body">
        <div class="col-lbl">
          <span>Dịch vụ</span><span style="text-align:center">SL</span>
          <span style="text-align:right">Đơn giá</span><span></span>
        </div>
        <div class="subrow">
          <input type="text" value="${esc(it.n)}" placeholder="Tên..." oninput="upd(${it.id},'n',this.value)" style="font-weight:700;color:var(--navy)">
          <input type="text" inputmode="decimal" value="${it.q||''}" placeholder="1" onchange="upd(${it.id},'q',this.value)" oninput="updCalcOnly(${it.id},'q',this.value)" style="text-align:center">
          <input type="text" inputmode="decimal" value="${it.p||''}" placeholder="Giá" onchange="upd(${it.id},'p',this.value)" oninput="updCalcOnly(${it.id},'p',this.value)" style="text-align:right">
          <span></span>
        </div>
        <textarea rows="1" placeholder="Ghi chú..." style="resize:none;font-size:12px;margin-top:5px;color:#666"
          oninput="upd(${it.id},'note',this.value)">${esc(it.note)}</textarea>
        <div class="disc-row">
          <label>Giảm giá</label>
          <div class="disc-input-wrap">
            <input type="text" inputmode="decimal" min="0" max="100" value="${it.disc||''}" placeholder="0"
              oninput="updDisc(${it.id},this.value)" style="text-align:center">
            <span>%</span>
          </div>
          ${it.disc>0?`<span class="disc-saving">− ${fmtD(iRaw(it)*(it.disc/100))}</span>`:''}
          <div class="unit-wrap">
            <label>Đơn vị</label>
            <input type="text" value="${esc(it.u)}" placeholder="ngày" oninput="upd(${it.id},'u',this.value)" style="text-align:center">
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function esc(s){return(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

// ── UTILS ──
function fmt(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function fmtD(n){return fmt(n)+' đ';}

function calcNights() {
  const ci=document.getElementById('f-checkin').value;
  const co=document.getElementById('f-checkout').value;
  if(ci&&co){
    const d=Math.round((new Date(co)-new Date(ci))/86400000);
    document.getElementById('f-nights').value=d>0?d+' đêm':'—';
  }
}
function fmtDate(v){if(!v)return'';const[y,m,d]=v.split('-');return`${d}/${m}/${y}`;}

function getRate(){ return parseFloat(document.getElementById('f-rate').value)||26323; }
function fmtUSD(vnd){ return '~$'+(vnd/getRate()).toFixed(1); }

// ── RENDER ──
function render() {
  const sub=items.reduce((s,i)=>s+iSum(i),0);
  const dep=parseFloat(document.getElementById('f-deposit').value)||0;
  const rem=sub-dep;
  document.getElementById('s-total').textContent=fmtD(sub);
  document.getElementById('s-usd').textContent=sub>0?fmtUSD(sub):'';
  document.getElementById('s-remain').textContent=dep>0?fmtD(rem):'—';
  buildHTML(document.getElementById('inv-export'), sub, dep, rem);
  if(curTab==='preview') renderPreview();
}

// ── BUILD INVOICE HTML ──
function buildHTML(target, sub, dep, rem) {
  const guest=document.getElementById('f-guest').value||'—';
  const ci=document.getElementById('f-checkin').value;
  const co=document.getElementById('f-checkout').value;
  const room=document.getElementById('f-room').value;
  const note=document.getElementById('f-note').value;

  const rows=items.map((it,idx)=>{
    const raw=iRaw(it), disc=it.disc||0, after=iSum(it);
    const qtyStr=(it.q??1)+(it.u?' '+it.u:'');
    const hasMeta = it.n && (it.p>0 || (it.q??1)!==1);
    const meta=hasMeta?`${qtyStr}${it.p>0?' × '+fmt(it.p)+' đ':''}`:null;
    const noteLine=it.note?`<span class="inv-item-note">${it.note}</span>`:'';
    const discLine=disc>0?`<span class="inv-item-disc">Giảm ${disc}% · −${fmt(raw*disc/100)} đ</span>`:'';
    const total=disc>0?fmt(after):raw>0?fmt(raw):'—';
    return `<tr>
    <td>
      <span class="inv-item-name">${it.n||'—'}</span>
      ${meta?`<span class="inv-item-meta">${meta}</span>`:''}
      ${noteLine}${discLine}
    </td>
    <td>${total}${total!='—'?' đ':''}</td>
  </tr>`;
  }).join('');

  const metaHtml=(ci||co||room)?`<div class="inv-meta">
    ${room?`<span>🛏 <strong>${room}</strong></span>`:''}
    ${ci?`<span>📅 Nhận phòng: <strong>${fmtDate(ci)}</strong></span>`:''}
    ${co?`<span>📅 Trả phòng: <strong>${fmtDate(co)}</strong></span>`:''}
  </div>`:'';

  const depHtml=dep>0?`<div class="inv-dep">
    <div class="inv-dep-row"><span>Tổng cộng</span><span>${fmt(sub)} đ</span></div>
    <div class="inv-dep-row"><span>Đã đặt cọc</span><span style="color:#27ae60">− ${fmt(dep)} đ</span></div>
    <div class="inv-dep-final"><span>Còn lại thanh toán</span><span>${fmt(rem)} đ <span style="font-size:11px;font-weight:400;color:#aaa">${fmtUSD(rem)}</span></span></div>
  </div>`:'';

  const noteHtml=note?`<div class="inv-note">${note}</div>`:'';

  target.innerHTML=`<div class="inv-pad">
    <div class="inv-topbar"></div>
    <div class="inv-corner"></div>
    <div class="inv-hdr">
      <div class="inv-logo">
        <div class="inv-logo-c"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
        <div><div class="inv-brand">SEN'S</div><div class="inv-brand-s">Homestay · Cao Bằng</div></div>
      </div>
      <div class="inv-contact">+84 822 946 888<br>060 Tổ 7, Ngọc Xuân<br>TP. Cao Bằng</div>
    </div>
    <div class="inv-title-row">
      <div class="inv-title">Hóa đơn</div>
      <div class="inv-guest-box"><span class="lbl">Khách</span><strong class="val">${guest}</strong></div>
    </div>
    <div class="inv-disc">Chỉ thanh toán bằng Việt Nam Đồng (VNĐ)</div>
    ${metaHtml}
    <table class="inv-tbl">
      <thead><tr><th>Dịch vụ</th><th style="text-align:right">Thành tiền</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="inv-total-box">
      <div class="inv-tot-lbl">Tổng</div>
      <div class="inv-tot-right">
        <div class="inv-tot-val">${fmt(sub)} đ</div>
        <div class="inv-tot-usd">${fmtUSD(sub)}</div>
      </div>
    </div>
    ${depHtml}${noteHtml}
    <div class="inv-stamp">Sen's Homestay · Cảm ơn quý khách ♥</div>
  </div>`;
}

// ── PREVIEW SCALING ──
function renderPreview() {
  const sub=items.reduce((s,i)=>s+iSum(i),0);
  const dep=parseFloat(document.getElementById('f-deposit').value)||0;
  buildHTML(document.getElementById('preview-inner'), sub, dep, sub-dep);
  scalePreview();
}

function scalePreview() {
  const wrap=document.getElementById('preview-wrap');
  const inner=document.getElementById('preview-inner');
  if(!wrap||!inner) return;
  const avail=wrap.parentElement.clientWidth - 28;
  const scale=avail/480;
  inner.style.transform=`scale(${scale})`;
  setTimeout(()=>{
    const h=inner.scrollHeight*scale;
    wrap.style.height=(h||200)+'px';
  },50);
}

// ── EXPORT ──
async function downloadImage() {
  setLoad(true);
  try {
    const src=document.getElementById('inv-export').firstElementChild;
    const canvas=await html2canvas(src,{scale:3,useCORS:true,backgroundColor:'#fff',logging:false,width:480,windowWidth:480});
    const a=document.createElement('a');
    a.download=`hoadon-${(document.getElementById('f-guest').value||'khach').replace(/\s+/g,'-')}.png`;
    a.href=canvas.toDataURL('image/png'); a.click();
  } catch(e){alert('Lỗi: '+e.message);}
  finally{setLoad(false);}
}

async function shareImage() {
  setLoad(true);
  try {
    const src=document.getElementById('inv-export').firstElementChild;
    const canvas=await html2canvas(src,{scale:3,useCORS:true,backgroundColor:'#fff',logging:false,width:480,windowWidth:480});
    canvas.toBlob(async(blob)=>{
      const name=`hoadon-${(document.getElementById('f-guest').value||'khach').replace(/\s+/g,'-')}.png`;
      const file=new File([blob],name,{type:'image/png'});
      if(navigator.share&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:"Sen's Hóa Đơn"});
      } else {
        try{
          await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
          alert('✅ Đã copy ảnh! Dán vào Zalo/Messenger.');
        }catch{alert('Dùng nút Tải PNG để lưu ảnh.');}
      }
      setLoad(false);
    });
  }catch(e){alert('Lỗi: '+e.message);setLoad(false);}
}

function setLoad(v){document.getElementById('loading').classList.toggle('show',v);}

function resetForm(){
  if(!confirm('Reset toàn bộ?'))return;
  items=[];idc=0;
  ['f-guest','f-room','f-checkin','f-checkout','f-nights','f-deposit','f-note']
    .forEach(id=>document.getElementById(id).value='');
  items.push({id:++idc, n:'Phòng (OTA)', q:1, u:'phòng', p:0, disc:0, note:''});
  drawForms();render();
}

init();
</script>
